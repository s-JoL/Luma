# The Xcode project is generated from this file rather than committed as a
# pbxproj: a generated project has readable diffs and cannot acquire the stale
# file references a hand-edited one collects. The source groups below are
# directories, but XcodeGen expands them into file references when it runs — so
# `xcodegen generate` is needed after adding or removing any source file, not
# only after adding a directory. A new file that is never generated in simply
# does not compile, and the error names whatever used it rather than the file.

name: Luma
options:
  bundleIdPrefix: works.earendil
  # iOS 18 rather than 17. The transcript's scroll behaviour is built on
  # `onScrollGeometryChange` and `onScrollPhaseChange` — the difference between
  # asking the scroll view where it is and inferring it from a sentinel view —
  # and the iOS 17 fallbacks for both were coarse enough to be their own class of
  # bug. Liquid Glass is still gated on 26 at the call site, so the app keeps its
  # look on 18 through 25 rather than requiring the newest OS to run at all.
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # 06-clients.md §iOS: one universal app, adaptive by size class.
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO

packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.1
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    from: 1.7.3
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    from: 4.2.2
  swift-collections:
    url: https://github.com/apple/swift-collections
    from: 1.1.0

targets:
  Luma:
    type: application
    platform: iOS
    sources:
      - path: Luma
      - path: Core
      - path: UI
    dependencies:
      - package: MarkdownUI
        product: MarkdownUI
      - package: SwiftMath
        product: SwiftMath
      - package: KeychainAccess
        product: KeychainAccess
      - package: swift-collections
        product: OrderedCollections
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: works.earendil.luma
        PRODUCT_NAME: Luma
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Luma/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # `complete` is the point of starting on Swift 6 rather than migrating
        # later: the stores are @MainActor and the clients are actors, and the
        # compiler is what keeps that true.
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES

  LumaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LumaTests
    dependencies:
      - target: Luma
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: works.earendil.luma.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete

  LumaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LumaUITests
    dependencies:
      - target: Luma
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: works.earendil.luma.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Luma:
    build:
      targets:
        Luma: all
        LumaTests: [test]
        LumaUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - LumaTests
        - LumaUITests
